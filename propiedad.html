<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <title>Detalle de Propiedad | Propiedades Collipulli</title>
  <meta name="description" content="Propiedades en venta y arriendo en Collipulli. Revisa casas, parcelas y oportunidades inmobiliarias en Propiedades Collipulli.">

  <meta property="og:type" content="website">

  <meta property="og:image" content="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1200&q=80">
  <meta property="og:url" content="https://propiedadescollipulli.cl/propiedad.html">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Propiedades Collipulli | Detalle de Propiedad">
  <meta name="twitter:description" content="Revisa propiedades en venta y arriendo en Collipulli.">
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1200&q=80">

  <!-- Google tag (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LXD6M6B2HH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });

    gtag('js', new Date());
    gtag('config', 'G-LXD6M6B2HH');
  </script>

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;
    n.push=n;
    n.loaded=!0;
    n.version='2.0';

    fbq('init', '26941683598762270');

  <noscript>
    <img height="1" width="1" style="display:none"
         src="https://www.facebook.com/tr?id=26941683598762270&ev=PageView&noscript=1"/>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

  <nav class="bg-blue-900 text-white p-4 shadow-lg sticky top-0 z-50">
    <div class="container mx-auto flex justify-between items-center">
      <a href="./index.html" class="text-xl font-bold tracking-tight">Propiedades Collipulli</a>
      <a href="./index.html" class="text-sm bg-blue-700 px-4 py-2 rounded-lg hover:bg-blue-600 transition font-semibold">
        Volver al listado
      </a>
    </div>
  </nav>

  <main class="container mx-auto p-4 flex-grow">
    <div id="property-detail" class="max-w-6xl mx-auto">
      <div class="text-center text-gray-500 py-12">Cargando propiedad...</div>
    </div>
  </main>

  <footer class="bg-gray-800 text-gray-400 py-6 text-center text-sm">
    <p>© 2026 Propiedades Collipulli</p>
  </footer>

  <div id="cookie-banner" class="fixed bottom-4 left-4 right-4 bg-white shadow-2xl rounded-xl p-4 z-50 border">
    <div class="flex flex-col md:flex-row items-center justify-between gap-4">
      <p class="text-sm text-gray-700">
        Utilizamos cookies para análisis y publicidad personalizada.
      </p>

      <div class="flex gap-3">
        <button onclick="acceptCookies()"
                class="bg-blue-900 text-white px-4 py-2 rounded-lg font-bold">
          Aceptar
        </button>

        <button onclick="rejectCookies()"
                class="bg-gray-200 px-4 py-2 rounded-lg">
          Rechazar
        </button>
      </div>
    </div>
  </div>

  <script>
    const propertyDetail = document.getElementById("property-detail");
    const whatsappNumero = "56989296908";
    const fallbackImage = "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1200&q=80";

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function formatDescription(texto) {
      if (!texto || !texto.trim()) {
        return "Propiedad disponible para mayor información vía WhatsApp.";
      }
      return texto.replace(/\n/g, "<br>");
    }

    function getMainImage(propiedad) {
      if (propiedad.imagenUrl && propiedad.imagenUrl !== "AQUÍ_IRÁ_LA_URL_DE_TU_FOTO_EN_S3") {
        return propiedad.imagenUrl;
      }

      if (Array.isArray(propiedad.galeria) && propiedad.galeria.length > 0) {
        return propiedad.galeria[0];
      }

      return fallbackImage;
    }

    function getGallery(propiedad) {
      const imagenPrincipal = getMainImage(propiedad);
      const galeria = Array.isArray(propiedad.galeria) && propiedad.galeria.length > 0
        ? propiedad.galeria.filter(Boolean)
        : [imagenPrincipal];

      if (!galeria.includes(imagenPrincipal)) {
        galeria.unshift(imagenPrincipal);
      }

      return galeria;
    }

    function getEstadoPropiedad(propiedad) {
      if (propiedad.estado) {
        return String(propiedad.estado).toLowerCase();
      }

      if (typeof propiedad.disponible === "boolean") {
        return propiedad.disponible ? "disponible" : "vendida";
      }

      return "disponible";
    }

    function getEstadoBadge(propiedad) {
      const estado = getEstadoPropiedad(propiedad);

      if (estado === "reservada") {
        return `<span class="inline-block text-sm font-bold bg-yellow-500 text-white px-4 py-2 rounded-full shadow">RESERVADA</span>`;
      }

      if (estado === "vendida") {
        return `<span class="inline-block text-sm font-bold bg-red-500 text-white px-4 py-2 rounded-full shadow">VENDIDA</span>`;
      }

      return `<span class="inline-block text-sm font-bold bg-green-500 text-white px-4 py-2 rounded-full shadow">DISPONIBLE</span>`;
    }

    function updateGeneralMetaTags(propiedad) {
      const titulo = propiedad.titulo || "Detalle de Propiedad";
      const descripcion = (propiedad.descripcion || "Revisa propiedades en venta y arriendo en Collipulli.")
        .replace(/\n/g, " ")
        .slice(0, 180);
      const imagen = getMainImage(propiedad);
      const urlActual = window.location.href;

      document.title = `${titulo} | Propiedades Collipulli`;

      const setMeta = (selector, value) => {
        const el = document.querySelector(selector);
        if (el) el.setAttribute("content", value);
      };

      setMeta('meta[name="description"]', descripcion);
      setMeta('meta[property="og:title"]', `${titulo} | Propiedades Collipulli`);
      setMeta('meta[property="og:description"]', descripcion);
      setMeta('meta[property="og:image"]', imagen);
      setMeta('meta[property="og:url"]', urlActual);
      setMeta('meta[name="twitter:title"]', `${titulo} | Propiedades Collipulli`);
      setMeta('meta[name="twitter:description"]', descripcion);
      setMeta('meta[name="twitter:image"]', imagen);
    }

    function copyPropertyLink(url) {
      navigator.clipboard.writeText(url)
        .then(() => alert("Enlace copiado al portapapeles"))
        .catch(() => alert("No se pudo copiar el enlace"));
    }

    function changeMainImage(url, clickedThumb = null) {
      const mainImage = document.getElementById("main-image");
      if (mainImage) {
        mainImage.src = url;
      }

      document.querySelectorAll(".gallery-thumb").forEach((el) => {
        el.classList.remove("ring-4", "ring-blue-500", "scale-[1.02]");
      });

      if (clickedThumb) {
        clickedThumb.classList.add("ring-4", "ring-blue-500", "scale-[1.02]");
      }
    }

    function renderGallery(propiedad) {
      const imagenPrincipal = getMainImage(propiedad);
      const galeria = getGallery(propiedad);

      return `
        <div class="space-y-4">
          <div class="bg-white rounded-3xl shadow-md overflow-hidden">
            <img
              id="main-image"
              src="${imagenPrincipal}"
              alt="${propiedad.titulo || "Propiedad"}"
              class="w-full h-[260px] md:h-[420px] object-cover bg-white"
            />
          </div>

          <div class="bg-white rounded-3xl shadow-md p-4">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-lg font-bold text-gray-800">Galería</h3>
              <span class="text-sm text-gray-500">${galeria.length} fotos</span>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
              ${galeria.map((url, index) => `
                <button
                  type="button"
                  onclick="changeMainImage('${url}', this)"
                  class="gallery-thumb ${index === 0 ? 'ring-4 ring-blue-500 scale-[1.02]' : ''} bg-white rounded-2xl overflow-hidden shadow-sm border hover:scale-[1.02] transition"
                >
                  <img
                    src="${url}"
                    alt="Imagen ${index + 1}"
                    class="w-full h-24 md:h-28 object-cover"
                  />
                </button>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function renderVideos(propiedad) {
      if (!Array.isArray(propiedad.videos) || propiedad.videos.length === 0) {
        return "";
      }

      return `
        <div class="border-t pt-6 mt-6">
          <h2 class="text-2xl font-bold text-gray-800 mb-4">Videos</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${propiedad.videos.map((videoUrl, index) => `
              <div class="bg-black rounded-2xl overflow-hidden shadow-md">
                <video controls class="w-full h-72 bg-black">
                  <source src="${videoUrl}" type="video/mp4">
                  Tu navegador no soporta la reproducción de video.
                </video>
                <div class="p-3 bg-white text-sm text-gray-600">
                  Video ${index + 1}
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderShareButtons(propiedad) {
      const absolutePropertyUrl = window.location.href;
      const facebookShareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(absolutePropertyUrl)}`;
      const whatsappShareText = encodeURIComponent(
        `Mira esta propiedad: ${propiedad.titulo || "Propiedad"} - ${absolutePropertyUrl}`
      );
      const whatsappShareLink = `https://wa.me/?text=${whatsappShareText}`;

      return `
        <div class="border-t pt-6 mt-6">
          <h2 class="text-2xl font-bold text-gray-800 mb-4">Compartir esta propiedad</h2>

          <div class="flex flex-wrap gap-3">
            <a
              href="${facebookShareUrl}"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-flex items-center gap-2 bg-blue-600 text-white px-5 py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-md"
            >
              <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
              Compartir en Facebook
            </a>

            <a
              href="${whatsappShareLink}"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-flex items-center gap-2 bg-green-500 text-white px-5 py-3 rounded-xl font-bold hover:bg-green-600 transition shadow-md"
            >
              <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20.52 3.48A11.86 11.86 0 0 0 12.06 0C5.52 0 .2 5.32.2 11.86c0 2.08.54 4.11 1.58 5.9L0 24l6.4-1.67a11.8 11.8 0 0 0 5.66 1.44h.01c6.54 0 11.86-5.32 11.86-11.86 0-3.17-1.24-6.15-3.41-8.43ZM12.07 21.74h-.01a9.84 9.84 0 0 1-5.01-1.37l-.36-.21-3.8.99 1.01-3.71-.23-.38a9.82 9.82 0 0 1-1.5-5.2c0-5.43 4.42-9.85 9.86-9.85 2.63 0 5.1 1.02 6.96 2.89a9.8 9.8 0 0 1 2.89 6.97c0 5.43-4.42 9.85-9.85 9.85Zm5.4-7.36c-.3-.15-1.77-.87-2.05-.97-.27-.1-.47-.15-.66.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.47-.88-.78-1.48-1.75-1.66-2.05-.17-.3-.02-.46.13-.61.14-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.66-.5h-.57c-.2 0-.52.07-.8.37-.27.3-1.05 1.02-1.05 2.5 0 1.47 1.07 2.9 1.22 3.1.15.2 2.1 3.2 5.08 4.49.71.31 1.27.49 1.7.63.71.23 1.35.2 1.86.12.57-.08 1.77-.72 2.02-1.42.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35Z"/>
              </svg>
              Compartir por WhatsApp
            </a>

            <button
              onclick="copyPropertyLink('${absolutePropertyUrl}')"
              type="button"
              class="inline-flex items-center gap-2 bg-pink-600 text-white px-5 py-3 rounded-xl font-bold hover:bg-pink-700 transition shadow-md"
            >
              <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M16 1H4a2 2 0 0 0-2 2v12h2V3h12V1Zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H8V7h11v14Z"/>
              </svg>
              Copiar enlace
            </button>
          </div>
        </div>
      `;
    }

    function renderProperty(propiedad) {
      const estadoBadge = getEstadoBadge(propiedad);

      const mensaje = encodeURIComponent(
        `Hola, me interesa la propiedad "${propiedad.titulo || "Sin título"}" ubicada en ${propiedad.ubicacion || "sin ubicación indicada"}.`
      );
      const whatsappLink = `https://wa.me/${whatsappNumero}?text=${mensaje}`;

      updateGeneralMetaTags(propiedad);

      propertyDetail.innerHTML = `
        <div class="bg-white rounded-3xl shadow-xl p-4 md:p-8">
          <div class="mb-8">
            ${renderGallery(propiedad)}
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2">
              <div class="mb-4">${estadoBadge}</div>

              <h1 class="text-3xl md:text-4xl font-black text-blue-900 mb-2">
                ${propiedad.titulo || "Sin título"}
              </h1>

              <p class="text-gray-500 text-lg mb-4">
                ${propiedad.ubicacion || "Ubicación no informada"}
              </p>

              <div class="flex flex-wrap gap-3 mb-6">
                <div class="bg-gray-100 px-4 py-3 rounded-xl font-semibold text-gray-700">
                  🛏️ ${propiedad.dormitorios || 0} Dormitorios
                </div>
                <div class="bg-gray-100 px-4 py-3 rounded-xl font-semibold text-gray-700">
                  🚿 ${propiedad.banos || 0} Baños
                </div>
              </div>

              <div class="border-t pt-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-3">Descripción</h2>
                <p class="text-gray-700 leading-7">
                  ${formatDescription(propiedad.descripcion || "")}
                </p>
              </div>

              ${renderShareButtons(propiedad)}
              ${renderVideos(propiedad)}
            </div>

            <div>
              <div class="bg-gray-50 rounded-2xl p-6 shadow-sm border sticky top-24">
                <p class="text-sm text-gray-500 mb-2">Precio</p>
                <p class="text-3xl font-black text-blue-900 mb-6">
                  ${propiedad.precio || "Consultar"}
                </p>

                <a
                  href="${whatsappLink}"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="block w-full text-center bg-green-500 text-white py-4 rounded-xl font-bold text-lg hover:bg-green-600 transition shadow-md mb-3"
                >
                  Consultar por WhatsApp
                </a>

                <a
                  href="./index.html"
                  class="block w-full text-center bg-blue-900 text-white py-4 rounded-xl font-bold hover:bg-blue-800 transition"
                >
                  Volver al listado
                </a>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function loadProperty() {
      try {
        const propertyId = getQueryParam("id");

        if (!propertyId) {
          propertyDetail.innerHTML = `
            <div class="text-center text-red-500 py-12">
              No se indicó el ID de la propiedad.
            </div>
          `;
          return;
        }

        const response = await fetch("https://propiedades-collipulli-assets.s3.amazonaws.com/data/propiedades.json?v=" + Date.now());

        if (!response.ok) {
          throw new Error("No se pudo cargar propiedades.json desde S3");
        }

        const propiedades = await response.json();
        const propiedad = propiedades.find(item => String(item.id) === String(propertyId));

        if (!propiedad) {
          propertyDetail.innerHTML = `
            <div class="text-center text-red-500 py-12">
              No se encontró la propiedad solicitada.
            </div>
          `;
          return;
        }

        renderProperty(propiedad);
      } catch (error) {
        console.error(error);
        propertyDetail.innerHTML = `
          <div class="text-center text-red-500 py-12">
            Error al cargar la propiedad.
          </div>
        `;
      }
    }

    function acceptCookies() {
      localStorage.setItem('cookiesAccepted', 'true');

      gtag('consent', 'update', {
        analytics_storage: 'granted',
        ad_storage: 'granted',
        ad_user_data: 'granted',
        ad_personalization: 'granted'
      });

      document.getElementById('cookie-banner').style.display = 'none';
    }

    function rejectCookies() {
      localStorage.setItem('cookiesAccepted', 'false');
      document.getElementById('cookie-banner').style.display = 'none';
    }

    window.addEventListener('load', function() {
      const consent = localStorage.getItem('cookiesAccepted');

      if (consent === 'true') {
        gtag('consent', 'update', {
          analytics_storage: 'granted',
          ad_storage: 'granted',
          ad_user_data: 'granted',
          ad_personalization: 'granted'
        });

        document.getElementById('cookie-banner').style.display = 'none';
      }

      if (consent === 'false') {
        document.getElementById('cookie-banner').style.display = 'none';
      }
    });

    loadProperty();
  </script>
</body>
</html>
